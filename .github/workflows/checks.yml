name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify recorded statistics and paper sources
        run: |
          python tests/check.py
          python tests/check_paper.py
